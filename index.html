<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gimnasio mental</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: entrenador moderno, enérgico y claro
   IDEA: una app de fitness, pero para el cerebro: anillos de progreso, rachas, tarjetas de colores
   PICTURE: anillo de progreso grande en la portada; en juego, el ejercicio llena la pantalla
   COLOUR and TYPE: fondo neutro, cuatro colores de categoría vivos, acento coral; Outfit
   LAYOUT: columna de móvil, chips de filtro, rejilla de tarjetas, botones al alcance del pulgar */
:root{color-scheme:light;--bg:#f3f4f9;--card:#ffffff;--card2:#f7f8fc;--ink:#0f1224;--mute:#6a7087;--line:#e4e6f0;--acc:#ff4d5e;--soft:#e9ebf4;--ok:#12b76a;--bad:#f04438;--okbg:#dcf7e8;--badbg:#fde4e2;--selbg:#e0eaff;--shadow:0 1px 2px rgba(15,18,36,.05),0 8px 24px rgba(15,18,36,.07);
--c-mem:#ff4d5e;--c-ate:#3b82f6;--c-vel:#f59e0b;--c-agi:#10b981}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0a0c16;--card:#151829;--card2:#1b1f35;--ink:#f2f3fa;--mute:#9298b3;--line:#262b45;--acc:#ff5f6f;--soft:#232843;--ok:#32d583;--bad:#ff6b5f;--okbg:#0f3d2a;--badbg:#4a1d1d;--selbg:#1c2d5a;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35)}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0a0c16;--card:#151829;--card2:#1b1f35;--ink:#f2f3fa;--mute:#9298b3;--line:#262b45;--acc:#ff5f6f;--soft:#232843;--ok:#32d583;--bad:#ff6b5f;--okbg:#0f3d2a;--badbg:#4a1d1d;--selbg:#1c2d5a;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Outfit,-apple-system,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation;-webkit-appearance:none;appearance:none;padding:0;margin:0;transition:transform .12s ease,background .15s,box-shadow .15s}
button:active{transform:scale(.96)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* portada */
.hello{display:flex;justify-content:space-between;align-items:center;margin:6px 0 14px}
.hello h1{font-size:clamp(30px,8vw,40px);line-height:1.05;margin:0;font-weight:800;letter-spacing:-.02em}
.hello p{margin:2px 0 0;color:var(--mute)}
.fire{background:var(--card);box-shadow:var(--shadow);border-radius:99px;padding:8px 14px;font-weight:800;white-space:nowrap}
.hero{background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:18px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
.ring{position:relative;width:150px;height:150px}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .in b{font-size:34px;font-weight:900;line-height:1}.ring .in span{font-size:13px;color:var(--mute)}
.lvl{font-size:13px;font-weight:700;color:var(--mute)}.lvl b{display:block;font-size:24px;color:var(--ink);line-height:1.1;margin:2px 0 10px}
.minibars{display:grid;gap:7px}
.mb{display:grid;grid-template-columns:78px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:13px;font-weight:600}
.mb i{height:8px;border-radius:9px;background:var(--soft);overflow:hidden;display:block}.mb i s{display:block;height:100%;border-radius:9px;background:var(--c)}
.mb em{font-style:normal;color:var(--mute);text-align:right}
@media(max-width:420px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.minibars{width:100%;text-align:left}}
.daily{margin-top:14px;width:100%;text-align:left;border-radius:24px;padding:18px;display:flex;gap:14px;align-items:center;color:#fff;background:#0f1224;box-shadow:var(--shadow);position:relative;overflow:hidden}
:root[data-theme=dark] .daily{background:#1f2440}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .daily{background:#1f2440}}
.daily::before{content:'';position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,var(--acc),transparent 70%);opacity:.55}
.daily .ic{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:28px;flex:none;position:relative}
.daily b{font-size:19px;display:block;position:relative}.daily span{opacity:.75;font-size:14px;position:relative}
.daily .go{margin-left:auto;background:var(--acc);color:#fff;border-radius:99px;padding:10px 16px;font-weight:800;white-space:nowrap;position:relative;opacity:1}
.chips{display:flex;gap:8px;overflow-x:auto;margin:22px -16px 14px;padding:2px 16px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:15px;min-height:40px;display:flex;gap:6px;align-items:center}
.chip.on{background:var(--ink);color:var(--bg)}
.chip .d{width:9px;height:9px;border-radius:50%;background:var(--c)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ex{background:var(--card);border-radius:22px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:150px;box-shadow:var(--shadow);position:relative;overflow:hidden;animation:fade .35s ease both}
.ex .icn{width:50px;height:50px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:27px;background:var(--tint)}
.ex .nm{font-weight:700;line-height:1.2;font-size:16px}
.ex .ft{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute);font-weight:600}
.st{letter-spacing:1px;color:#f5b301;font-size:15px}.st i{color:var(--line);font-style:normal}
.foot{color:var(--mute);font-size:13px;margin-top:26px;text-align:center}
/* intro / resultado */
.back{font-weight:700;color:var(--mute);min-height:44px;display:inline-flex;align-items:center;gap:6px}
.panel{background:var(--card);border-radius:28px;padding:22px;box-shadow:var(--shadow);margin-top:6px;position:relative;overflow:hidden}
.banner{margin:-22px -22px 18px;padding:26px 22px;background:var(--c);color:#fff;position:relative;overflow:hidden}
.banner::after{content:'';position:absolute;right:-30px;bottom:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.14)}
.banner .bi{font-size:56px;line-height:1;position:relative;z-index:1}
.banner .tg{font-size:13px;font-weight:700;opacity:.9;margin-top:10px;position:relative;z-index:1}
.banner h1{font-size:clamp(28px,8vw,38px);line-height:1.05;margin:4px 0 0;font-weight:800;letter-spacing:-.02em;position:relative;z-index:1}
.howto{font-size:17px;margin:0 0 14px}
.pill{display:inline-flex;gap:8px;align-items:center;background:var(--card2);border-radius:99px;padding:6px 12px;font-weight:600;font-size:14px;color:var(--mute)}
.btn{display:block;width:100%;padding:16px;border-radius:18px;font-weight:800;font-size:18px;background:var(--acc);color:#fff;margin-top:14px;min-height:56px;box-shadow:0 8px 20px -8px var(--acc)}
.btn.alt{background:var(--soft);color:var(--ink);box-shadow:none}
.row{display:flex;gap:10px}.row .btn{flex:1}
.bigstars{font-size:52px;letter-spacing:6px;text-align:center;color:#f5b301;margin-top:6px}.bigstars span>*{display:inline-block}
.bigstars i{font-style:normal;color:var(--line)}
.pop{display:inline-block;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}to{transform:none}}
.score{text-align:center;font-size:clamp(52px,15vw,72px);font-weight:900;line-height:1;letter-spacing:-.03em}
.score small{font-size:22px;color:var(--mute);font-weight:700}
.center{text-align:center}.mute{color:var(--mute)}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(520px) rotate(540deg);opacity:0}}
.sumrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-weight:600;gap:10px}
/* juego */
.play{display:flex;flex-direction:column;min-height:calc(100vh - 46px);min-height:calc(100dvh - 46px)}
.top{display:flex;align-items:center;gap:10px}
.top .x{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:17px;font-weight:800;flex:none}
.top .t{font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:17px}
.top .hud{font-weight:700;font-size:14px;white-space:nowrap;background:var(--card);box-shadow:var(--shadow);border-radius:99px;padding:7px 12px}
.bar{height:6px;background:var(--soft);border-radius:9px;margin:12px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#ff9a5a);border-radius:9px}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:280px;padding:16px 10px;border-radius:28px;background:var(--card);box-shadow:var(--shadow);border:3px solid transparent}
.stage.ok{animation:okf .45s}.stage.bad{animation:badf .45s}
@keyframes okf{0%{border-color:var(--ok);background:var(--okbg)}100%{border-color:transparent}}
@keyframes badf{0%{border-color:var(--bad);background:var(--badbg);transform:translateX(-5px)}30%{transform:translateX(5px)}60%{transform:translateX(-3px)}100%{border-color:transparent;transform:none}}
.big-sym{font-size:clamp(70px,24vw,120px);font-weight:800;line-height:1.1;min-height:1.2em;text-align:center}
.big-word{font-size:clamp(36px,11vw,58px);font-weight:900;min-height:1.3em;text-align:center;letter-spacing:.01em}
.prompt{font-size:21px;font-weight:700;text-align:center;text-wrap:balance}
.prompt.small{font-size:16px;color:var(--mute);font-weight:600}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:clamp(30px,9vw,44px);font-weight:700;letter-spacing:5px;text-align:center}
.opts{display:grid;gap:10px;padding-top:12px}
.opt{background:var(--card);box-shadow:var(--shadow);border:2px solid transparent;border-radius:18px;padding:14px 8px;font-weight:700;font-size:19px;min-height:58px}
.opt.emo{padding:10px 4px}
.opt.big{font-size:22px;min-height:80px;background:var(--ink);color:var(--bg)}
.opt.sm{font-size:16px;min-height:48px;padding:8px}
.opt.sel{border-color:var(--c-ate);background:var(--selbg)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.miss{border-style:dashed;border-color:var(--ok)}
.opt.primary{background:var(--acc);color:#fff}
.opt.ghost{background:var(--soft);box-shadow:none;font-size:16px}
.opt.tilebtn{aspect-ratio:1;min-height:0;padding:0;background:var(--soft);box-shadow:none;color:var(--mute);font-size:26px}
.span2{grid-column:span 2}
.opt:disabled{opacity:.92}
.tiles{display:grid;gap:8px;width:min(100%,440px)}
.tile{aspect-ratio:1;border-radius:16px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:clamp(20px,7vw,34px);font-weight:800;transition:background .12s,transform .12s,opacity .12s,box-shadow .12s}
.tiles.locked{pointer-events:none}
.tile.lit{background:var(--acc);color:#fff;box-shadow:0 6px 18px -6px var(--acc)}
.tile.x{background:var(--bad);color:#fff}
.tile.miss{box-shadow:inset 0 0 0 3px var(--acc)}
.tile.e{background:var(--card2);border:1px solid var(--line)}
.tile.e.lit{background:var(--okbg);border:2px solid var(--ok);box-shadow:none;color:inherit}
.tile.num{font-size:clamp(18px,6vw,28px);background:var(--card2);border:1px solid var(--line)}
.tile.num.lit{background:var(--soft);color:var(--mute);border-color:transparent;box-shadow:none}
.tile.ch{font-size:clamp(22px,7vw,32px);background:var(--card2);border:1px solid var(--line);font-family:Outfit,sans-serif}
.tile.ch.lit{background:var(--okbg);border:2px solid var(--ok);color:inherit;box-shadow:none}
.simon .tile{opacity:.4}.simon .tile.lit{opacity:1;transform:scale(1.04);box-shadow:0 0 34px currentColor}
.card{position:relative}.card .face{visibility:hidden}
.card::after{content:'?';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mute);font-family:Outfit,sans-serif;font-weight:800;font-size:28px}
.card.up{background:var(--card)}.card.up .face{visibility:visible;animation:pop .25s ease both}.card.up::after{content:none}.card.lit{background:var(--okbg)!important;border-color:var(--ok)}
.show-grid{display:grid;gap:8px;width:min(100%,440px)}
.show-grid div{aspect-ratio:1;border-radius:16px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.show-grid div.empty{background:var(--soft);border-color:transparent}
.slots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.slot{min-width:46px;height:58px;border-bottom:3px solid var(--ink);font-size:36px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.kp-disp{font-size:clamp(30px,10vw,44px);font-weight:800;letter-spacing:6px;font-family:ui-monospace,Menlo,monospace}
.react{width:100%;height:min(52vh,380px);border-radius:24px;font-size:28px;font-weight:800;color:#fff}
.react.wait{background:#e5484d}.react.go{background:#12b76a}.react.early{background:#5b6075}
.flash{width:140px;height:140px;border-radius:50%;background:var(--soft);transition:background .05s}
.flash.on{background:var(--acc);box-shadow:0 0 50px var(--acc)}
.pair{font-size:clamp(48px,15vw,72px);font-weight:800}
.tile.e,.show-grid div{font-size:min(calc(min(92vw,440px) / var(--cols,4) * .58),72px);line-height:1}
.opt.emo{font-size:min(calc(min(92vw,560px) / var(--cols,4) * .5),64px);line-height:1.1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
{
/* ---------- utilidades ---------- */
const h=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='html')e.innerHTML=v;else e.setAttribute(k,v)}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e};
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(a,n)=>shuffle(a).slice(0,n);
const range=(a,b)=>Array.from({length:b-a},(_,i)=>a+i);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const app=document.getElementById('app');
let AC=null;
const beep=(f,d=.2)=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.setValueAtTime(.12,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}};
const KEY='gimnasio-mental-v1';
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}};
const DATA=load();DATA.best=DATA.best||{};DATA.daily=DATA.daily||{};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(DATA))}catch(e){}};

/* ---------- material ---------- */
const ANIMALES=['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🦉','🐴','🦄','🐝','🐢','🐙','🐬','🐳','🦀','🦒','🐘'];
const FRUTAS=['🍎','🍐','🍊','🍋','🍌','🍉','🍇','🍓','🍒','🍑','🥭','🍍','🥥','🥝','🍅','🥑'];
const OBJETOS=['⚽','🎸','📚','✏️','🔑','⏰','📷','🎈','🧸','🚲','🚗','✈️','🚀','⛵','🏠','💡','🎁','🧩','🎲','🔔','☂️','👓','🎩','🧲'];
const CARAS=['😀','😃','😄','😁','😆','😅','🙂','🙃','😉','😊','😇','😌','😍','😎','🤓','🧐','😏','😐','😑','😶'];
const SIMILARES=[['😀','😃'],['🙂','🙃'],['😐','😑'],['🌑','🌚'],['🔵','🟦'],['❤️','🧡'],['🕐','🕑'],['⬆️','⬇️'],['🐱','🐈'],['🍎','🍅'],['👍','👎'],['⭐','🌟'],['🟢','🟩'],['😺','😸'],['🔒','🔓'],['🌕','🌝'],['📗','📘'],['🍊','🍋'],['🐢','🦎'],['🔈','🔉']];
const PALABRAS=['casa','perro','mesa','río','luna','pan','tren','libro','silla','flor','nube','barco','queso','reloj','llave','campo','playa','monte','vaso','zapato','puerta','árbol','coche','lápiz','sol','gato','fuego','hoja','piedra','cama','camisa','botella','ventana','globo','pez','tambor','cuchara','manzana','caballo','estrella'];
const ANAG=['PLAYA','MONTE','QUESO','RELOJ','TIGRE','FRESA','PIANO','BARCO','CIELO','MANGO','PLUMA','FUEGO','PUERTA','CAMINO','VENTANA','JARDIN','CEBOLLA','NARANJA','ZAPATO','CABALLO','TORTUGA','CAMISA','CUCHARA','ESCUELA','MERCADO','VERANO','TOMATE','PALOMA','BOTELLA','ESPEJO'];
const COLORES=[{n:'ROJO',c:'#e03131'},{n:'AZUL',c:'#1c7ed6'},{n:'VERDE',c:'#2f9e44'},{n:'AMARILLO',c:'#f2a900'}];
const LETRAS='BCDFGHJKLMNPRST'.split('');

/* ---------- contexto de juego (cancelable) ---------- */
class Cancel extends Error{}
function makeCtx(stage,opts,hud,barI){
  let alive=true;const cancels=new Set();
  const ctx={stage,opts,
    abort(){alive=false;[...cancels].forEach(f=>f());cancels.clear()},
    wait(setup){return new Promise((res,rej)=>{if(!alive)return rej(new Cancel);let settled=false,cleanup=null;
      const fin=fn=>{if(settled)return;settled=true;cancels.delete(cancel);try{cleanup&&cleanup()}catch(e){}fn()};
      const cancel=()=>fin(()=>rej(new Cancel));cancels.add(cancel);
      cleanup=setup(v=>fin(()=>res(v)))||null;if(settled&&cleanup){try{cleanup()}catch(e){}}})},
    sleep(ms){return ctx.wait(done=>{const t=setTimeout(done,ms);return()=>clearTimeout(t)})},
    show(...nodes){stage.innerHTML='';stage.append(...nodes)},
    hud(t){hud.textContent=t},
    fb(ok){stage.classList.remove('ok','bad');void stage.offsetWidth;stage.classList.add(ok?'ok':'bad');if(!ok&&navigator.vibrate)try{navigator.vibrate(50)}catch(e){}},
    startBar(ms){barI.style.transition='none';barI.style.width='100%';void barI.offsetWidth;barI.style.transition=`width ${ms}ms linear`;barI.style.width='0%'},
    stopBar(){barI.style.transition='none';barI.style.width='0'},
    setCols(n){opts.style.gridTemplateColumns=`repeat(${n},minmax(0,1fr))`;opts.style.setProperty('--cols',n)},
    choose(labels,{timeout=0,cols=2,cls=''}={}){return ctx.wait(done=>{opts.innerHTML='';ctx.setCols(cols);
      labels.forEach((l,i)=>opts.append(h('button',{class:'opt '+cls,onclick:()=>done(i)},l)));
      let t;if(timeout){ctx.startBar(timeout);t=setTimeout(()=>done(-1),timeout)}
      return()=>{clearTimeout(t);ctx.stopBar();[...opts.children].forEach(b=>b.disabled=true)}})},
    keypad(len){const disp=h('div',{class:'kp-disp'});stage.append(disp);let v='';const upd=()=>disp.textContent=(v+'_'.repeat(len)).slice(0,Math.max(len,v.length));upd();

async function trials(ctx,n,make,{timeout=0,cols=2,pause=500,cls=''}={}){
  let score=0;
  for(let i=0;i<n;i++){ctx.hud(`${i+1}/${n} · ✔ ${score}`);ctx.opts.innerHTML='';
    const t=await make(i);
    const k=await ctx.choose(t.options,{timeout:t.timeout??timeout,cols:t.cols||cols,cls:t.cls||cls});
    const ok=k===t.correct;if(ok)score++;const bs=ctx.opts.children;
    if(k>=0&&bs[k])bs[k].classList.add(ok?'ok':'bad');if(bs[t.correct])bs[t.correct].classList.add('ok');
    ctx.fb(ok);await ctx.sleep(t.pause??pause)}
  return{score,max:n};
}
async function stream(ctx,{items,targets,label,interval,render}){
  let ok=0;const n=items.length;
  for(let i=0;i<n;i++){ctx.hud(`${i+1}/${n} · ✔ ${ok}`);ctx.show(render(items[i]));
    const pressed=await ctx.wait(done=>{ctx.opts.innerHTML='';ctx.setCols(1);ctx.opts.append(h('button',{class:'opt big',onclick:()=>done(true)},label));const t=setTimeout(()=>done(false),interval);return()=>clearTimeout(t)});
    const good=pressed===targets[i];if(good)ok++;if(pressed||targets[i])ctx.fb(good);
    ctx.show(render(''));await ctx.sleep(280)}
  return{score:ok,max:n};
}
async function pairs(ctx,set,np,cols){
  ctx.opts.innerHTML='';const deck=shuffle(sample(set,np).flatMap(e=>[e,e]));
  const g=h('div',{class:'tiles',style:`grid-template-columns:repeat(${cols},minmax(0,1fr));--cols:${cols}`});
  const cards=deck.map(e=>{const c=h('button',{class:'tile e card','aria-label':'carta'},h('span',{class:'face'},e));c.style.background='var(--soft)';g.append(c);return c});
  ctx.show(g);let moves=0,matched=0;ctx.hud('Intentos: 0');
  const up=c=>{c.classList.add('up');c.style.background='var(--card)';c.dataset.up=1},down=c=>{c.classList.remove('up');c.style.background='var(--soft)';delete c.dataset.up};
  await ctx.wait(done=>{let open=[],busy=false;
    cards.forEach((c,i)=>c.onclick=()=>{if(busy||c.dataset.up)return;up(c);open.push(i);
      if(open.length===2){moves++;ctx.hud('Intentos: '+moves);const[a,b]=open;open=[];
        if(deck[a]===deck[b]){cards[a].classList.add('lit');cards[b].classList.add('lit');matched++;if(matched===np)setTimeout(done,500)}
        else{busy=true;setTimeout(()=>{down(cards[a]);down(cards[b]);busy=false},800)}}});
    return()=>cards.forEach(c=>c.onclick=null)});
  return{score:clamp(Math.round(10*(np*4-moves)/(np*2.5)),0,10),max:10,extra:`${moves} intentos para ${np} parejas`};
}
async function digitSpan(ctx,{start,reverse,maxLen}){
  let len=start,lives=2,best=0;
  while(lives>0&&len<=maxLen){ctx.hud(`Longitud ${len} · ${'❤️'.repeat(lives)}`);ctx.opts.innerHTML='';
    const seq=[];while(seq.length<len){const d=rnd(10);if(d!==seq.at(-1))seq.push(d)}
    ctx.show(h('div',{class:'prompt small'},'Atento…'));await ctx.sleep(900);
    for(const d of seq){ctx.show(h('div',{class:'big-sym'},d));await ctx.sleep(750);ctx.show(h('div',{class:'big-sym'},''));await ctx.sleep(220)}
    ctx.show(h('div',{class:'prompt'},reverse?'Escríbelos al revés':'Escríbelos en el mismo orden'));
    const ans=await ctx.keypad(len);const target=(reverse?[...seq].reverse():seq).join('');const ok=ans===target;ctx.fb(ok);
    ctx.show(h('div',{class:'prompt'},ok?'¡Correcto!':'Era '+target));ctx.opts.innerHTML='';
    if(ok){best=len;len++}else lives--;await ctx.sleep(1100)}
  return{score:best,max:maxLen,extra:`Mejor secuencia: ${best} cifras`};
}
async function tileSeq(ctx,{n,cols,colors,start,maxLen,simon}){
  ctx.opts.innerHTML='';const g=h('div',{class:'tiles'+(simon?' simon':''),style:`grid-template-columns:repeat(${cols},minmax(0,1fr));--cols:${cols}`});
  const tones=[330,392,440,523];
  const tiles=range(0,n).map(i=>{const b=h('button',{class:'tile',style:colors?`background:${colors[i]};color:${colors[i]}`:''});g.append(b);return b});
  ctx.show(g);let seq=[],len=start,lives=simon?1:2,best=0;
  const light=async(i,ms)=>{tiles[i].classList.add('lit');if(simon)beep(tones[i],ms/1000);await ctx.sleep(ms);tiles[i].classList.remove('lit')};
  while(lives>0&&len<=maxLen){ctx.hud(`Nivel ${len} · ${'❤️'.repeat(lives)}`);
    if(simon){while(seq.length<len)seq.push(rnd(n))}else seq=sample(range(0,n),len);
    g.classList.add('locked');await ctx.sleep(800);const sp=Math.max(320,620-len*25);
    for(const i of seq){await light(i,sp);await ctx.sleep(170)}
    g.classList.remove('locked');
    const ok=await ctx.wait(done=>{let k=0;const fs=tiles.map((t,i)=>{const f=()=>{t.classList.add('lit');if(simon)beep(tones[i],.15);setTimeout(()=>t.classList.remove('lit'),170);if(i!==seq[k])return done(false);k++;if(k===seq.length)done(true)};t.addEventListener('click',f);return f});return()=>tiles.forEach((t,i)=>t.removeEventListener('click',fs[i]))});
    ctx.fb(ok);if(ok){best=len;len++}else lives--;await ctx.sleep(700)}
  return{score:best,max:maxLen,extra:`Secuencia más larga: ${best}`};
}
async function matrix(ctx,{rounds,mirror}){
  let score=0,k=3;
  for(let r=0;r<rounds;r++){const size=k<=4?3:k<=7?4:5,n=size*size;ctx.hud(`${r+1}/${rounds} · ✔ ${score}`);ctx.opts.innerHTML='';
    const cells=sample(range(0,n),k);const target=new Set(mirror?cells.map(i=>Math.floor(i/size)*size+(size-1-i%size)):cells);
    const g=h('div',{class:'tiles locked',style:`grid-template-columns:repeat(${size},minmax(0,1fr));--cols:${size}`});
    const tiles=range(0,n).map(()=>{const t=h('button',{class:'tile'});g.append(t);return t});
    ctx.show(h('div',{class:'prompt small'},mirror?'Luego toca las casillas en espejo (izquierda ↔ derecha)':'Recuerda las casillas iluminadas'),g);
    await ctx.sleep(600);cells.forEach(i=>tiles[i].classList.add('lit'));await ctx.sleep(900+k*250);cells.forEach(i=>tiles[i].classList.remove('lit'));g.classList.remove('locked');
    const ok=await ctx.wait(done=>{let found=0,errs=0;tiles.forEach((t,i)=>t.onclick=()=>{if(t.classList.contains('lit')||t.classList.contains('x'))return;if(target.has(i)){t.classList.add('lit');if(++found===target.size)done(true)}else{t.classList.add('x');if(++errs>=2)done(false)}});return()=>tiles.forEach(t=>t.onclick=null)});
    target.forEach(i=>{if(!tiles[i].classList.contains('lit'))tiles[i].classList.add('miss')});
    ctx.fb(ok);if(ok){score++;k++}else k=Math.max(3,k-1);await ctx.sleep(1000)}
  return{score,max:rounds};
}
async function schulte(ctx,{order,cols,t10,t0}){
  ctx.opts.innerHTML='';const items=shuffle(order.map((l,i)=>({l,i})));let next=0,errs=0;
  const status=h('div',{class:'prompt'},'Busca: ',h('b',{},order[0]));
  const g=h('div',{class:'tiles',style:`grid-template-columns:repeat(${cols},minmax(0,1fr));--cols:${cols}`});
  ctx.show(status,g);const t0s=performance.now();
  await ctx.wait(done=>{items.forEach(it=>{const b=h('button',{class:'tile num'},it.l);b.onclick=()=>{if(it.i===next){b.classList.add('lit');next++;if(next===order.length)done();else{status.innerHTML='';status.append('Busca: ',h('b',{},order[next]))}}else if(it.i>next){errs++;ctx.fb(false)}};g.append(b)});
    const iv=setInterval(()=>ctx.hud(`${((performance.now()-t0s)/1000).toFixed(1)} s · errores ${errs}`),100);return()=>clearInterval(iv)});

}

    const g=h('div',{class:'tiles',style:'grid-template-columns:repeat(6,minmax(0,1fr));gap:5px'});c.show(h('div',{class:'prompt'},'Toca todas las ',h('b',{style:'color:var(--acc);font-size:28px'},t)),g);
    const errs=await c.wait(done=>{let f=0,e=0;cells.forEach(ch=>{const b=h('button',{class:'tile ch'},ch);b.onclick=()=>{if(b.classList.contains('lit')||b.classList.contains('x'))return;if(ch===t){b.classList.add('lit');if(++f===k)done(e)}else{b.classList.add('x');c.fb(false);if(++e>=3)done(99)}};g.append(b)});c.startBar(15000);const tm=setTimeout(()=>done(99),15000);return()=>{clearTimeout(tm);c.stopBar()}});
    const pts=errs===0?2:errs===1?1:0;score+=pts;c.fb(pts>0);await c.sleep(800)}
  return{score,max:10}}},
{id:'cu',cat:'ate',name:'¿Cuántos había?',how:'Verás un montón de frutas unos segundos. Después te preguntaremos cuántas había de una en concreto.',run:c=>trials(c,8,async()=>{const ty=sample(FRUTAS,3),cnt=2+rnd(6),oth=5+rnd(5);const items=[...Array(cnt).fill(ty[0]),...Array.from({length:oth},()=>pick([ty[1],ty[2]]))];const cells=shuffle([...items,...Array(16-items.length).fill('')]);
  c.show(h('div',{class:'prompt small'},'Mira bien'),grid(cells,4));await c.sleep(2600);c.show(h('div',{class:'prompt'},'¿Cuántos había?'),h('div',{class:'big-sym',style:'font-size:clamp(64px,20vw,96px)'},ty[0]));return{...numOpts(cnt,[1,2]),cols:4}})},
{id:'fd',cat:'ate',name:'Cuenta los destellos',how:'El círculo se encenderá varias veces muy rápido. Cuenta cuántas.',run:c=>trials(c,6,async()=>{const N=4+rnd(7),f=h('div',{class:'flash'});c.show(h('div',{class:'prompt small'},'Cuenta…'),f);await c.sleep(900);
  for(let i=0;i<N;i++){f.classList.add('on');await c.sleep(120);f.classList.remove('on');await c.sleep(160+rnd(180))}
  c.show(h('div',{class:'prompt'},'¿Cuántos destellos?'));return{...numOpts(N,[1,2]),cols:4}})},

{id:'re',cat:'vel',name:'Tiempo de reacción',how:'Cuando el rectángulo se ponga VERDE, tócalo lo más rápido posible. Si tocas antes, cuenta como salida falsa. 5 intentos.',run:async c=>{const times=[];let faults=0;c.opts.innerHTML='';
  while(times.length<5){c.hud(`${times.length+1}/5`);const a=h('button',{class:'react wait'},'Espera al verde…');c.show(a);
    const r=await c.wait(done=>{let go=false,t0=0;const tm=setTimeout(()=>{go=true;a.className='react go';a.textContent='¡TOCA!';t0=performance.now()},1500+Math.random()*2800);a.onpointerdown=()=>done(go?performance.now()-t0:-1);return()=>{clearTimeout(tm);a.onpointerdown=null}});
    if(r<0){faults++;a.className='react early';a.textContent='¡Demasiado pronto!';c.fb(false)}else{times.push(r);a.textContent=Math.round(r)+' ms'}await c.sleep(1100)}
  const avg=times.reduce((s,x)=>s+x,0)/5+faults*30;return{score:clamp(Math.round(10*(560-avg)/300),0,10),max:10,extra:`Media ${Math.round(avg)} ms${faults?` (con ${faults} salidas falsas, +30 ms cada una)`:''}`}}},
{id:'gn',cat:'vel',name:'Solo frutas',how:'Irán saliendo dibujos. Pulsa ¡AHORA! solo cuando salga una fruta. Con los demás, quieto.',run:c=>{const items=[],tg=[];for(let i=0;i<25;i++){const t=Math.random()<.4;tg.push(t);items.push(t?pick(FRUTAS.filter(f=>f!=='🍅')):pick([...ANIMALES,...OBJETOS]))}return stream(c,{items,targets:tg,label:'¡AHORA!',interval:1050,render:x=>h('div',{class:'big-sym'},x)})}},
{id:'id',cat:'vel',name:'¿Iguales o distintas?',how:'Compara las dos series de caracteres y decide si son idénticas. Tienes 4 segundos.',run:c=>{const ch='ABCDEFGHJKLMNPRSTUVXYZ23456789';return trials(c,15,async i=>{const L=5+Math.floor(i/4);const a=Array.from({length:L},()=>pick(ch));const b=[...a];const same=Math.random()<.5;if(!same){const p=rnd(L);let x;do{x=pick(ch)}while(x===a[p]);b[p]=x}c.show(h('div',{class:'mono'},a.join('')),h('div',{class:'mono'},b.join('')));return{options:['Iguales','Distintas'],correct:same?0:1}},{timeout:4000,pause:350})}},
{id:'mm',cat:'vel',name:'¿Mayor o menor?',how:'Sale un número. Cada número nuevo, di si es mayor o menor que el anterior, que ya no verás. 2,5 segundos.',run:async c=>{let prev=1+rnd(99);c.opts.innerHTML='';c.show(h('div',{class:'prompt small'},'Recuerda este número'),h('div',{class:'big-sym'},prev));await c.sleep(1600);
  return trials(c,20,async()=>{let n;do{n=1+rnd(99)}while(n===prev);const corr=n>prev?1:0;prev=n;c.show(h('div',{class:'prompt small'},'¿Mayor o menor que el anterior?'),h('div',{class:'big-sym'},n));return{options:['⬇ Menor','⬆ Mayor'],correct:corr}},{timeout:2500,pause:300})}},

{id:'ca',cat:'agi',name:'Cálculo rápido',how:'Resuelve sumas, restas y multiplicaciones. 7 segundos por operación.',run:c=>trials(c,15,async()=>{const op=pick(['+','−','×']);let a,b,r;if(op==='+'){a=10+rnd(60);b=5+rnd(40);r=a+b}else if(op==='−'){a=20+rnd(70);b=5+rnd(a-5);r=a-b}else{a=2+rnd(10);b=2+rnd(10);r=a*b}c.show(h('div',{class:'big-word'},`${a} ${op} ${b}`));return numOpts(r)},{timeout:7000,pause:350})},
{id:'se',cat:'agi',name:'Suma encadenada',how:'Saldrá un número cada vez. Suma el número que ves con el ANTERIOR (que ya no está en pantalla). 4,5 segundos.',run:async c=>{let prev=1+rnd(9);c.opts.innerHTML='';c.show(h('div',{class:'prompt small'},'Primer número'),h('div',{class:'big-sym'},prev));await c.sleep(1800);
  return trials(c,15,async()=>{const n=1+rnd(9),s=n+prev;prev=n;c.show(h('div',{class:'prompt small'},'Este + el anterior'),h('div',{class:'big-sym'},n));return numOpts(s,[1,2])},{timeout:4500,pause:300})}},
{id:'sr',cat:'agi',name:'Series numéricas',how:'Descubre la regla de la serie y elige el número que sigue.',run:c=>trials(c,10,async()=>{const t=rnd(6);let s;
  if(t===0){const a=1+rnd(20),d=2+rnd(9);s=range(0,6).map(i=>a+i*d)}else if(t===1){const a=1+rnd(4),r=2+rnd(2);s=range(0,6).map(i=>a*r**i)}
  else if(t===2){const d1=1+rnd(5),d2=5+rnd(6);s=[1+rnd(10)];for(let i=1;i<6;i++)s.push(s[i-1]+(i%2?d1:d2))}else if(t===3){const o=rnd(4);s=range(1,7).map(i=>(i+o)**2)}
  else if(t===4){s=[1+rnd(4),1+rnd(4)];while(s.length<6)s.push(s.at(-1)+s.at(-2))}else{const a=60+rnd(40),d=3+rnd(7);s=range(0,6).map(i=>a-i*d)}
  c.show(h('div',{class:'big-word',style:'font-size:clamp(26px,8vw,40px)'},s.slice(0,5).join(', ')+', ?'));return numOpts(s[5],[1,2,3,5])},{pause:700})},
{id:'an',cat:'agi',name:'Anagramas',how:'Ordena las letras para formar una palabra. Toca las letras en orden; ⌫ borra la última. 40 segundos por palabra.',run:async c=>{const ws=sample(ANAG,8);let score=0;
  for(let i=0;i<8;i++){const w=ws[i];let sc;do{sc=shuffle([...w])}while(sc.join('')===w);c.hud(`${i+1}/8 · ✔ ${score}`);const slots=h('div',{class:'slots'});c.show(h('div',{class:'prompt small'},'Forma la palabra'),slots);
    const ok=await c.wait(done=>{let typed=[];c.opts.innerHTML='';c.setCols(4);const draw=()=>{slots.innerHTML='';for(let k=0;k<w.length;k++)slots.append(h('span',{class:'slot'},typed[k]?typed[k].ch:''))};
      sc.forEach(ch=>{const b=h('button',{class:'opt'},ch);b.onclick=()=>{if(b.disabled)return;b.disabled=true;b.style.opacity=.3;typed.push({ch,b});draw();if(typed.length===w.length){if(typed.map(t=>t.ch).join('')===w)done(true);else{c.fb(false);setTimeout(()=>{typed.forEach(t=>{t.b.disabled=false;t.b.style.opacity=''});typed=[];draw()},500)}}};c.opts.append(b)});
      c.opts.append(h('button',{class:'opt ghost span2',onclick:()=>{const t=typed.pop();if(t){t.b.disabled=false;t.b.style.opacity='';draw()}}},'⌫ Borrar'),h('button',{class:'opt ghost span2',onclick:()=>done(false)},'Saltar'));
      draw();c.startBar(40000);const tm=setTimeout(()=>done(false),40000);return()=>{clearTimeout(tm);c.stopBar()}});
    if(ok)score++;c.fb(ok);c.opts.innerHTML='';c.show(h('div',{class:'prompt'},ok?'¡Bien! ':'Era ',h('b',{},w)));await c.sleep(1200)}
  return{score,max:8}}}
];
function nback(c,n){const items=[];for(let i=0;i<22;i++){if(i>=n&&Math.random()<.33)items.push(items[i-n]);else{let x;do{x=pick(LETRAS)}while(i>=n&&x===items[i-n]);items.push(x)}}
  const tg=items.map((x,i)=>i>=n&&x===items[i-n]);return stream(c,{items,targets:tg,label:'IGUAL',interval:n===1?1500:2000,render:x=>h('div',{class:'big-sym'},x)})}
EX.forEach((e,i)=>e.num=i+1);
const byId=Object.fromEntries(EX.map(e=>[e.id,e]));

/* ---------- pantallas ---------- */
let ctx=null,challenge=null;
const starsOf=p=>p>=90?3:p>=70?2:p>=40?1:0;
const starStr=s=>h('span',{},'★'.repeat(s),h('i',{},'★'.repeat(3-s)));
const today=()=>new Date().toISOString().slice(0,10);
function dailyList(){let s=[...today()].reduce((a,ch)=>(a*31+ch.charCodeAt(0))>>>0,7);const r=()=>(s=(s*1664525+1013904223)>>>0)/4294967296;const a=EX.map(e=>e.id);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,5)}
function streak(){let n=0;const d=new Date();for(;;){const k=d.toISOString().slice(0,10);if(DATA.daily[k]==null)break;n++;d.setDate(d.getDate()-1)}return n}

const ICONS={pa:'🐶',pf:'🍓',pc:'😀',si:'🟢',di:'🔢',dr:'🔁',co:'🟧',ma:'🔲',es:'🪞',qc:'🔄',qf:'❓',lp:'📝',as:'🔗',os:'➡️',de:'📍',n1:'1️⃣',n2:'2️⃣',st:'🎨',cc:'✅',fl:'↔️',s1:'🔟',s2:'🔤',s3:'🔀',od:'🔍',bl:'🔎',cu:'🧮',fd:'💡',re:'⚡',gn:'🍎',id:'⚖️',mm:'↕️',ca:'➕',se:'➿',sr:'📈',an:'🔠'};
const TINT={mem:'rgba(255,77,94,.14)',ate:'rgba(59,130,246,.14)',vel:'rgba(245,158,11,.18)',agi:'rgba(16,185,129,.15)'};
let filter='all';
const svgNS='http://www.w3.org/2000/svg';
function ring(pct){const s=document.createElementNS(svgNS,'svg');s.setAttribute('viewBox','0 0 120 120');const r=50,C=2*Math.PI*r;
  s.innerHTML=`<circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--soft)" stroke-width="12"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--acc)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1s ease"/>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{s.lastChild.style.strokeDashoffset=C*(1-pct)}));return s}
function level(t){const L=[[0,'Principiante'],[10,'Aprendiz'],[30,'En forma'],[55,'Atleta mental'],[80,'Experto'],[100,'Maestro']];let n=L[0][1];for(const[v,k]of L)if(t>=v)n=k;return n}
function home(){
  if(ctx){ctx.abort();ctx=null}challenge=null;app.innerHTML='';window.scrollTo(0,0);
  const sOf=e=>starsOf(DATA.best[e.id]?.pct??-1);const total=EX.reduce((s,e)=>s+sOf(e),0),max=EX.length*3;
  const dd=DATA.daily[today()],stk=streak();
  const hero=h('div',{class:'hero fade'},h('div',{class:'ring'},ring(total/max),h('div',{class:'in'},h('b',{},total),h('span',{},`de ${max} ★`))),
    h('div',{},h('div',{class:'lvl'},'Tu nivel',h('b',{},level(total))),h('div',{class:'minibars'},Object.entries(CATS).map(([k,c])=>{const ex=EX.filter(e=>e.cat===k),s=ex.reduce((a,e)=>a+sOf(e),0),m=ex.length*3;
      return h('div',{class:'mb',style:`--c:${c.c}`},h('span',{},c.n.split(' ')[0]),h('i',{},h('s',{style:`width:${Math.round(100*s/m)}%`})),h('em',{},`${s}/${m}`))}))));
  app.append(h('div',{class:'hello'},h('div',{},h('h1',{},'Gimnasio mental'),h('p',{},`${EX.length} ejercicios de memoria y concentración`)),h('div',{class:'fire',title:'Días seguidos con reto'},`🔥 ${stk}`)),hero,
    h('button',{class:'daily fade',onclick:startDaily},h('span',{class:'ic'},'🏆'),h('div',{},h('b',{},'Reto del día'),h('span',{},dd!=null?`Hecho hoy: ${dd}%`:'5 ejercicios nuevos cada día')),h('span',{class:'go'},dd!=null?'Repetir':'Empezar')));
  const chips=h('div',{class:'chips'}),gridEl=h('div',{class:'grid'});
  const draw=()=>{chips.innerHTML='';[['all','Todos','var(--ink)'],...Object.entries(CATS).map(([k,c])=>[k,c.n,c.c])].forEach(([k,n,c])=>chips.append(h('button',{class:'chip'+(filter===k?' on':''),style:`--c:${c}`,onclick:()=>{filter=k;draw()}},k==='all'?null:h('span',{class:'d'}),n)));
    gridEl.innerHTML='';EX.filter(e=>filter==='all'||e.cat===filter).forEach((e,i)=>{const b=DATA.best[e.id];gridEl.append(h('button',{class:'ex',style:`--tint:${TINT[e.cat]};animation-delay:${Math.min(i,12)*25}ms`,onclick:()=>intro(e)},
      h('span',{class:'icn'},ICONS[e.id]),h('span',{class:'nm'},e.name),h('span',{class:'ft'},h('span',{},b?`${b.pct}%`:'Nuevo'),h('span',{class:'st'},starStr(sOf(e))))))})};
  draw();app.append(chips,gridEl,h('p',{class:'foot'},'Tus récords se guardan solo en este dispositivo.'));
}
function intro(e){
  app.innerHTML='';window.scrollTo(0,0);const cat=CATS[e.cat],b=DATA.best[e.id];
  app.append(h('button',{class:'back',onclick:home},challenge?'✕ Salir del reto':'← Ejercicios'),
    h('div',{class:'panel fade',style:`--c:${cat.c}`},h('div',{class:'banner'},h('div',{class:'bi'},ICONS[e.id]),h('div',{class:'tg'},challenge?`Reto del día · ${challenge.idx+1} de 5`:`${cat.n} · Nº ${e.num}`),h('h1',{},e.name)),
      h('p',{class:'howto'},e.how),
      h('span',{class:'pill'},b?['Mejor marca ',h('b',{style:'color:var(--ink)'},b.pct+'%'),' ',h('span',{class:'st'},starStr(starsOf(b.pct)))]:'Aún no lo has probado'),
      h('button',{class:'btn',onclick:()=>{beep(660,.05);play(e)}},'Empezar')));
}
async function play(e){
  if(ctx)ctx.abort();app.innerHTML='';window.scrollTo(0,0);
  const hud=h('div',{class:'hud'}),barI=h('i'),stage=h('div',{class:'stage'}),opts=h('div',{class:'opts'});
  app.append(h('div',{class:'play fade'},h('div',{class:'top'},h('button',{class:'x','aria-label':'Salir',onclick:()=>intro(e)},'✕'),h('div',{class:'t'},`${ICONS[e.id]} ${e.name}`),hud),h('div',{class:'bar'},barI),stage,opts));
  const my=ctx=makeCtx(stage,opts,hud,barI);
  try{const r=await e.run(my);if(my===ctx){ctx=null;result(e,r)}}catch(err){if(!(err instanceof Cancel)){console.error(err);stage.innerHTML='';stage.append(h('div',{class:'prompt'},'Algo ha fallado. Vuelve a intentarlo.'))}}
}
function confetti(){const c=h('div',{class:'confetti'});const cols=['#ff4d5e','#3b82f6','#f59e0b','#10b981','#a3e635'];for(let i=0;i<40;i++)c.append(h('i',{style:`left:${Math.random()*100}%;background:${pick(cols)};animation-delay:${Math.random()*.6}s;animation-duration:${1.4+Math.random()}s`}));return c}
function bigStars(st){return h('div',{class:'bigstars'},range(0,3).map(i=>i<st?h('span',{class:'pop',style:`animation-delay:${.15+i*.18}s`},'★'):h('i',{},'★')))}
function result(e,{score,max,extra}){
  const pct=Math.round(100*clamp(score,0,max)/max),st=starsOf(pct),prev=DATA.best[e.id];
  const rec=!prev||pct>prev.pct;DATA.best[e.id]={pct:rec?pct:prev.pct,plays:(prev?.plays||0)+1};save();
  if(challenge)challenge.res.push(pct);
  const msg=pct>=90?'¡Impresionante!':pct>=70?'¡Muy bien!':pct>=40?'Bien, puedes mejorar':'Sigue practicando';
  app.innerHTML='';window.scrollTo(0,0);const last=challenge&&challenge.idx>=4;
  if(st>=2)beep(880,.15);
  app.append(h('div',{class:'panel center fade',style:`--c:${CATS[e.cat].c}`},st>=2?confetti():null,h('div',{class:'pill'},`${ICONS[e.id]} ${e.name}`),bigStars(st),
    h('div',{class:'score'},score,h('small',{},` / ${max}`)),h('h1',{style:'font-size:28px;margin:10px 0 4px;font-weight:800'},msg),extra?h('p',{class:'mute',style:'margin:0 0 8px'},extra):null,
    h('p',{style:'font-weight:600'},rec&&prev?'🏅 ¡Nuevo récord personal!':`Mejor marca: ${DATA.best[e.id].pct}%`),
    challenge?h('button',{class:'btn',onclick:()=>{if(last)dailySummary();else{challenge.idx++;intro(byId[challenge.list[challenge.idx]])}}},last?'Ver resultado del reto':`Siguiente (${challenge.idx+2} de 5)`)
      :h('div',{class:'row'},h('button',{class:'btn alt',onclick:home},'Menú'),h('button',{class:'btn',onclick:()=>play(e)},'Repetir'))));
}
function startDaily(){challenge={list:dailyList(),idx:0,res:[]};intro(byId[challenge.list[0]])}
function dailySummary(){
  const ch=challenge,avg=Math.round(ch.res.reduce((a,b)=>a+b,0)/ch.res.length);DATA.daily[today()]=Math.max(avg,DATA.daily[today()]??0);save();challenge=null;
  app.innerHTML='';app.append(h('div',{class:'panel fade',style:'--c:var(--acc)'},confetti(),h('div',{class:'banner'},h('div',{class:'bi'},'🏆'),h('div',{class:'tg'},'Reto del día completado'),h('h1',{},`${avg}% de media`)),
    ch.list.map((id,i)=>h('div',{class:'sumrow'},h('span',{},`${ICONS[id]} ${byId[id].name}`),h('span',{style:'white-space:nowrap'},`${ch.res[i]}% `,h('span',{class:'st'},starStr(starsOf(ch.res[i])))))),
    h('p',{class:'mute'},`🔥 Racha: ${streak()} día(s). Vuelve mañana para un reto nuevo.`),h('button',{class:'btn',onclick:home},'Volver al menú')));
}
home();
}
